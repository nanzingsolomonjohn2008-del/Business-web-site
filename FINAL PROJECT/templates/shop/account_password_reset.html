{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | ANNELSA LUXURY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/account.css' %}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <header class="auth-brand">
            <div class="auth-mark" aria-label="ANNELSA LUXURY monogram">AS</div>
            <p class="auth-brand-name">ANNELSA LUXURY</p>
        </header>
        <h1 class="auth-heading">Forgot your password?</h1>
        <p class="auth-intro">
            Enter your account email and we will send a confirmation code if an account matches.
        </p>
        <form method="post" action="{% url 'account_password_reset' %}" class="auth-form">
            {% csrf_token %}
            <label for="{{ form.email.id_for_label }}">Email address</label>
            {{ form.email }}
            {% for error in form.email.errors %}
                <p class="auth-field-errors" role="alert">{{ error }}</p>
            {% endfor %}
            <button type="submit" class="auth-submit">SEND CONFIRMATION CODE</button>
        </form>
        <a href="{% url 'account_login' %}" class="auth-back-link">Back to sign in</a>
    </main>
</body>
</html>
